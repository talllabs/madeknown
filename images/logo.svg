<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Black square background -->
  <rect width="200" height="200" fill="#000"/>

  <!-- White inner area with grungy painted edges -->
  <rect x="14" y="14" width="172" height="172" fill="#fff" filter="url(#rough)"/>

  <!-- ── BIRD SILHOUETTE ─────────────────────────────── -->

  <!-- Body -->
  <ellipse cx="88" cy="128" rx="20" ry="25" fill="#000"/>

  <!-- Neck (long curve up-left from body) -->
  <path d="M80 108 C76 96 70 86 64 78 C60 72 56 66 58 58 C60 52 66 50 70 54
           C68 48 72 42 76 46 C74 42 78 38 82 42
           C80 46 78 54 80 60 C82 54 86 52 88 56
           C84 62 82 72 84 80 C88 74 92 74 94 78
           C90 84 86 94 88 104 C90 98 94 96 96 100
           C92 106 88 114 88 120" stroke="#000" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Head blob -->
  <ellipse cx="64" cy="56" rx="16" ry="13" fill="#000"/>

  <!-- Beak pointing left -->
  <path d="M50 52 L22 68 L50 64Z" fill="#000"/>

  <!-- Head crest / tuft -->
  <path d="M68 44 C66 34 64 26 68 18 C72 26 72 36 68 44Z" fill="#000"/>
  <path d="M76 42 C76 32 78 24 82 18 C84 26 82 36 76 42Z" fill="#000"/>

  <!-- Wing — dramatic sweep upper-right, multiple feather layers -->
  <!-- Feather layer 1 (outermost) -->
  <path d="M98 110 C114 92 134 72 154 52 C168 36 180 22 188 14
           C178 20 164 36 150 52 C168 30 182 16 190 10
           C178 14 162 30 146 48Z" fill="#000"/>

  <!-- Feather layer 2 -->
  <path d="M96 114 C110 98 128 80 146 62 C162 46 176 32 184 22
           C172 30 158 46 144 62 C160 44 174 28 180 20
           C166 28 150 46 134 64Z" fill="#000"/>

  <!-- Feather layer 3 -->
  <path d="M94 118 C106 104 122 88 138 72 C152 58 166 44 174 34
           C162 44 148 58 134 74 C148 58 160 44 168 36
           C154 46 138 62 122 80Z" fill="#000"/>

  <!-- Wing base / fill -->
  <path d="M92 122 C100 110 112 96 126 82 C140 68 154 54 164 44
           C150 58 136 72 122 88 C108 102 96 116 90 126Z" fill="#000"/>

  <!-- Legs -->
  <line x1="80" y1="152" x2="74" y2="174" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="152" x2="94" y2="174" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <!-- Talons -->
  <line x1="74" y1="174" x2="64" y2="180" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="74" y1="174" x2="72" y2="182" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="94" y1="174" x2="84" y2="180" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="94" y1="174" x2="92" y2="182" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
</svg>
